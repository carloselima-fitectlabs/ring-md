name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev xvfb

      # Ubuntu 24.04 ships Neovim 0.9; RingMD needs 0.10+ (F2.R3).
      - name: Install Neovim
        env:
          NVIM_VERSION: v0.10.4
        run: |
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Check Neovim
        run: nvim --version | head -1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Smoke test (app starts under Xvfb)
        run: |
          cargo build --locked
          export GSK_RENDERER=cairo
          xvfb-run -a bash -c '
            ./target/debug/ringmd README.md & pid=$!
            sleep 5
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"; echo "ringmd exited early with status $?"; exit 1
            fi
            kill "$pid"
          '
